name: e2e

on:
  push:
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Verify ASP.NET Core Docker image
        run: npm run dotnet:docker:verify

      - name: Run ASP.NET Core API E2E
        run: npm run e2e:dotnet

      - name: Run Expo web with ASP.NET Core API E2E
        run: npm run e2e:dotnet-mobile

      - name: Run Playwright E2E
        run: npm run e2e

      - name: Upload ASP.NET Core Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dotnet
          path: playwright-report-dotnet/
          retention-days: 7

      - name: Upload Expo web with ASP.NET Core Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-dotnet-mobile
          path: playwright-report-dotnet-mobile/
          retention-days: 7

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
